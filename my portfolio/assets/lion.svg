<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title>Bad Boy Lion Avatar</title>
  <desc>A cool lion avatar wearing sunglasses and a hoodie.</desc>

  <defs>
    <radialGradient id="sceneGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#4c2d7f" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#2d1b4e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0612" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="furLight" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ffc880"/>
      <stop offset="50%" stop-color="#d99a55"/>
      <stop offset="100%" stop-color="#8a4b22"/>
    </radialGradient>

    <linearGradient id="maneShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4523"/>
      <stop offset="50%" stop-color="#402312"/>
      <stop offset="100%" stop-color="#1c120d"/>
    </linearGradient>

    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#0f1020"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>

    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0612"/>
      <stop offset="50%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#050309"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="512" cy="512" r="420" fill="url(#sceneGlow)"/>

  <g filter="url(#shadow)">
    <!-- Hoodie / shoulders -->
    <path d="M260 760c18-140 68-232 146-290 28-20 62-36 104-48 0 0 2 12 2 20 0 49 0 114-1 130-3 46-33 95-79 126-44 30-94 44-146 44h-26Z" fill="url(#hoodie)"/>
    <path d="M764 760c-18-140-68-232-146-290-28-20-62-36-104-48 0 0-2 12-2 20 0 49 0 114 1 130 3 46 33 95 79 126 44 30 94 44 146 44h26Z" fill="url(#hoodie)"/>

    <path d="M292 778c18-118 59-198 123-241 33-22 69-33 105-33s72 11 105 33c64 43 105 123 123 241H292Z" fill="#0a0612"/>
    <path d="M332 718c15-78 47-132 97-163 24-15 50-22 76-22s52 7 76 22c50 31 82 85 97 163H332Z" fill="url(#hoodie)" opacity="0.7"/>

    <!-- Mane / main head -->
    <path d="M272 399c-6-52 0-99 18-142 19-45 48-78 90-99 40-20 83-30 132-30s92 10 132 30c42 21 71 54 90 99 18 43 24 90 18 142-7 57-28 104-64 145-42 48-94 72-176 72s-134-24-176-72c-36-41-57-88-64-145Z" fill="url(#maneShade)"/>
    <path d="M295 392c-5-45 0-85 15-123 16-39 40-68 76-86 34-17 72-26 118-26s84 9 118 26c36 18 60 47 76 86 15 38 20 78 15 123-6 49-24 89-55 124-37 42-83 63-154 63s-117-21-154-63c-31-35-49-75-55-124Z" fill="url(#furLight)"/>
    <path d="M316 403c-4-36 0-68 12-98 13-32 33-56 63-71 28-14 59-21 99-21s71 7 99 21c30 15 50 39 63 71 12 30 16 62 12 98-5 39-20 71-46 99-31 35-70 52-128 52s-97-17-128-52c-26-28-41-60-46-99Z" fill="#f8c68b"/>
  </g>

  <g filter="url(#softShadow)">
    <!-- Face / muzzle -->
    <path d="M340 412c7-26 22-45 44-58 22-14 46-20 68-20s46 6 68 20c22 13 37 32 44 58 4 14 6 31 6 48 0 33-10 60-31 82-21 23-49 35-87 35s-66-12-87-35c-21-22-31-49-31-82 0-17 2-34 6-48Z" fill="#f5d1a9"/>

    <!-- Eyes -->
    <ellipse cx="418" cy="485" rx="12" ry="9" fill="#271913"/>
    <ellipse cx="606" cy="485" rx="12" ry="9" fill="#271913"/>

    <!-- Mouth / nose -->
    <path d="M439 519c10 12 23 18 35 18 13 0 25-6 35-18" stroke="#8b5130" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M412 560c18 10 36 15 62 15s44-5 62-15" stroke="#f0b78c" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <g filter="url(#softShadow)">
    <!-- Sunglasses -->
    <path d="M315 425c34-23 74-35 120-35s86 12 120 35" stroke="#0a0612" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M302 417c36-29 81-44 133-44s97 15 133 44" stroke="#0f1020" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Sunglasses lens frames -->
    <rect x="337" y="394" width="80" height="58" rx="20" transform="rotate(-9 337 394)" fill="url(#glass)"/>
    <rect x="607" y="394" width="80" height="58" rx="20" transform="rotate(9 607 394)" fill="url(#glass)"/>

    <!-- Bridge and connections -->
    <rect x="416" y="416" width="192" height="10" rx="5" fill="#0a0612"/>
    <rect x="404" y="385" width="18" height="18" rx="9" fill="#0a0612"/>
    <rect x="602" y="385" width="18" height="18" rx="9" fill="#0a0612"/>

    <!-- Light reflections on sunglasses -->
    <path d="M358 423h55" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>
    <path d="M628 423h55" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Mane details -->
  <g opacity="0.85">
    <path d="M344 245c24-40 60-68 109-84-12 31-22 63-30 96-34-2-59-6-79-12Z" fill="#8f5028"/>
    <path d="M681 245c-24-40-60-68-109-84 12 31 22 63 30 96 34-2 59-6 79-12Z" fill="#8f5028"/>
    <path d="M301 282c-14-10-25-25-34-44 4-36 15-68 34-97 20 7 38 20 52 38-18 10-34 23-52 103Z" fill="#bb723d"/>
    <path d="M723 282c14-10 25-25 34-44-4-36-15-68-34-97-20 7-38 20-52 38 18 10 34 23 52 103Z" fill="#bb723d"/>
  </g>

  <!-- Hoodie drawstrings / details -->
  <g filter="url(#softShadow)">
    <path d="M352 778c28-34 58-52 96-54 21-1 39 2 56 10 17-8 35-11 56-10 38 2 68 20 96 54-29 24-71 37-128 37s-99-13-128-37Z" fill="#07050d"/>
    <path d="M359 778c11-15 25-26 42-34 11 15 18 30 22 49h-44l-20-15Z" fill="#0a0612"/>
    <path d="M665 778c-11-15-25-26-42-34-11 15-18 30-22 49h44l20-15Z" fill="#0a0612"/>
  </g>

</svg>
